name: Check data files

# Catches mistakes when sources or sponsored/book data are edited (in the admin panel or by hand).
on:
  push:
    paths: ['data/sources/**', 'data/monetization/**']
  pull_request:
    paths: ['data/sources/**', 'data/monetization/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate-sources
