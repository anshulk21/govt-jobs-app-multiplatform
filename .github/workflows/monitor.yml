name: Monitor official sources

on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours at :17 (GitHub often delays or skips runs at the top of the hour)
  workflow_dispatch:
    inputs:
      all:
        description: Run every enabled source (ignore priority)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # to start the "Publish jobs" workflow for notifications

# Never run two monitors at once (they would fight over the same files).
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/monitor-run
        with:
          # --seed=3: the first time a source is checked, its 3 newest notices become drafts
          # (so you have real jobs to review straight away); after that only new notices do.
          args: --seed=3 ${{ inputs.all && '--all' || '' }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          github-token: ${{ github.token }}

  # Second pass from a server in India (README → "Server in India"), for the sources that just failed
  # on GitHub: many Indian government sites block foreign servers. Skipped until the repository
  # variable INDIA_RUNNER is "true", so nothing waits for a server that isn't set up.
  monitor-india:
    needs: monitor
    if: ${{ !cancelled() && vars.INDIA_RUNNER == 'true' }}
    runs-on: [self-hosted, india]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # includes the first job's results, so --only-failing sees today's failures
      - uses: ./.github/actions/monitor-run
        with:
          # Same health file as `npm run monitor:local` on your own PC.
          args: --only-failing --runner=local --seed=3
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          github-token: ${{ github.token }}
