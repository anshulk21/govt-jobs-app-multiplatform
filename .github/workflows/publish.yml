name: Publish jobs

# Runs when job files change (e.g. you save a job in the admin panel at /admin):
#   1. moves jobs set to Published / Rejected into the right folder and checks them
#   2. commits that (Cloudflare then rebuilds the website and JSON API)
#   3. sends push notifications for newly published jobs and timeline updates
#   4. posts them to the public Telegram channel (if set up)
# Commits made by the monitor (GITHUB_TOKEN) don't trigger this, by GitHub's design.
on:
  push:
    branches: [main]
    paths: ['data/jobs/**']
  workflow_dispatch:
    inputs:
      before:
        description: Send notifications for jobs published since this commit (used by the monitor's auto-publishing)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One publish at a time (the delayed free-user alerts below don't block this).
    concurrency:
      group: publish
      cancel-in-progress: false
    outputs:
      after: ${{ steps.commit.outputs.after }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Move published / rejected jobs into place
        if: github.event_name == 'push' || inputs.before == ''
        run: npm run admin:apply -- --before "${{ github.event.before }}"

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/jobs
          if [ ! -f .admin-commit-msg ] || git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -F .admin-commit-msg
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
          fi
          echo "after=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Send push notifications (Pro members first when Pro is on)
        if: github.event_name == 'push' || inputs.before != ''
        run: npm run push:published -- --before "${{ github.event.before || inputs.before }}" --after HEAD --phase=first
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Post to the Telegram channel
        # README → "Telegram channel". Does nothing until the TELEGRAM_CHANNEL_ID variable is set.
        if: github.event_name == 'push' || inputs.before != ''
        continue-on-error: true # a Telegram problem must not fail publishing
        run: npm run telegram:channel -- --before "${{ github.event.before || inputs.before }}" --after HEAD
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}

  # When Pro is on: everyone else gets the same new-job alerts a little later.
  free-alerts:
    needs: publish
    if: github.event_name == 'push' || inputs.before != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.publish.outputs.after }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Send delayed alerts to non-Pro users
        run: npm run push:published -- --before "${{ github.event.before || inputs.before }}" --after HEAD --phase=later
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
