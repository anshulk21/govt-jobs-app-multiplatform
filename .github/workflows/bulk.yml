name: Bulk update drafts

# Publish or reject many drafts at once (Actions → Bulk update drafts → Run workflow).
# Always try a dry run first: it lists what would change without changing anything.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Publish or reject the matching drafts
        type: choice
        options: [publish, reject]
        default: publish
      sources:
        description: Only these source IDs, comma separated (e.g. ssc,bpsc,ibps). Empty = all.
        required: false
      states:
        description: Only these states/UTs, comma separated (e.g. UP,BR — or central). Empty = all.
        required: false
      title_has:
        description: Only titles containing any of these words (e.g. recruitment,advt,vacancy). Empty = any.
        required: false
      title_not:
        description: Skip titles containing any of these words (e.g. calendar,annexure,cpio).
        required: false
      limit:
        description: At most this many jobs (empty = no limit)
        required: false
      dry_run:
        description: Dry run (only show what would change)
        type: boolean
        default: true
      notify:
        description: Send push notifications for newly published jobs (one per job — careful with many)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Select drafts
        run: >
          npm run --silent admin:bulk --
          --action="${{ inputs.action }}"
          --sources="${{ inputs.sources }}"
          --states="${{ inputs.states }}"
          --title-has="${{ inputs.title_has }}"
          --title-not="${{ inputs.title_not }}"
          --limit="${{ inputs.limit }}"
          ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Check, move and commit
        if: ${{ !inputs.dry_run }}
        run: |
          echo "BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          npm run admin:apply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/jobs
          if [ ! -f .admin-commit-msg ] || git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -F .admin-commit-msg
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
          fi

      - name: Send push notifications
        if: ${{ !inputs.dry_run && inputs.notify }}
        run: npm run push:published -- --before "$BEFORE" --after HEAD --phase=all
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
